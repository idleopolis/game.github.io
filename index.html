<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="Fish Tycoon - Build your aquarium empire!" />
    <title>Fish Tycoon</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
      
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: #0c1929;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      }
      
      #game-container {
        width: 100vw;
        height: 100vh;
        margin: 0;
        padding: 0;
        display: block;
        position: fixed;
        top: 0;
        left: 0;
      }
      
      canvas {
        display: block;
        width: 100vw !important;
        height: 100vh !important;
        margin: 0;
        padding: 0;
      }
      
      #loading {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(180deg, #0c1929 0%, #0f2942 50%, #0c1929 100%);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 1000;
        transition: opacity 0.5s ease-out;
      }
      
      #loading.hidden {
        opacity: 0;
        pointer-events: none;
      }
      
      .loading-spinner {
        width: 48px;
        height: 48px;
        border: 3px solid rgba(255, 255, 255, 0.1);
        border-top-color: #0ea5e9;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      
      .loading-text {
        margin-top: 24px;
        color: rgba(255, 255, 255, 0.7);
        font-size: 14px;
        font-weight: 500;
        letter-spacing: 2px;
        text-transform: uppercase;
      }
      
      .loading-title {
        margin-bottom: 40px;
        color: #0ea5e9;
        font-size: 36px;
        font-weight: 700;
        text-shadow: 0 0 20px rgba(14, 165, 233, 0.5);
      }
      
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <script type="module" crossorigin src="./assets/index-BjUv2vF9.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/phaser-BLuo3lxs.js">
  </head>
  <body>
    <div id="loading">
      <div class="loading-title">🐟 Fish Tycoon</div>
      <div class="loading-spinner"></div>
      <div class="loading-text">Diving in...</div>
    </div>
    <div id="game-container"></div>
  </body>
</html>
